name: Build and Test

# =============================================================================
# GitFlow CI/CD
# -----------------------------------------------------------------------------
# Branch model:
#   main              - stable / production branch (protected)
#   dev               - integration / development branch
#   feature/*         - branched from dev, merged back into dev
#   release/*         - branched from dev, merged into main AND dev
#   hotfix/*          - branched from main, merged into main AND dev
#
# Versioning (SemVer):
#   release/* merge to main => bump minor, reset patch (or major on BREAKING)
#   hotfix/*  merge to main => bump patch              (or major on BREAKING)
#   A version tag (vX.Y.Z) is created on main only. dev carries the next
#   development version.
# =============================================================================

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: false
      bump_mode:
        description: 'Version bump mode for release/hotfix on main'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - release
          - hotfix
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # macOS Build
  # =====================================================================
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    # Skip redundant full rebuilds when the triggering push is a version bump
    # (bump_version.py auto-pushes a '[skip ci]' commit to main). PR events
    # always build.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        run: |
          python3 -c 'import pathlib,re; text=pathlib.Path("CMakeLists.txt").read_text(); print("version=" + re.search(r"project\s*\([^)]*?VERSION\s+(\d+\.\d+\.\d+)", text, re.S).group(1))' >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Homebrew (Apple Silicon)
        id: cache-brew
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar
          key: brew-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}

      - name: Install build tools and dependencies
        run: |
          brew install cmake ninja
          brew install llvm googletest libzip zstd nlohmann-json libuv

      - name: Configure CMake
        run: |
          cmake --preset macos-homebrew-ninja

      - name: Build all targets
        run: |
          cmake --build build/macos-homebrew-ninja

      - name: Run all tests
        run: |
          ctest --preset macos-homebrew-ninja --verbose --output-on-failure

      - name: Package artifacts
        run: |
          cmake --install build/macos-homebrew-ninja --prefix package
          tar -czf "hoo-${{ steps.version.outputs.version }}-macos-arm64.tar.gz" -C package .

      - name: Verify package contents
        run: |
          ls -la package/bin/
          ls -la package/lib/
          test -f package/bin/hoo || (echo "ERROR: hoo binary missing!" && exit 1)
          test -f package/lib/libhoo-core.a || (echo "ERROR: hoo-core library missing!" && exit 1)
          test -f package/lib/libhoo-parser.a || (echo "ERROR: hoo-parser library missing!" && exit 1)
          test -f package/lib/libhoort.a || (echo "ERROR: hoort library missing!" && exit 1)
          test -f package/lib/libhoorepl.a || (echo "ERROR: hoorepl library missing!" && exit 1)
          package/bin/hoo --version | grep "v${{ steps.version.outputs.version }}"
          echo "Package verification successful"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-macos-arm64
          path: hoo-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
          retention-days: 30

  # =====================================================================
  # Linux Build
  # =====================================================================
  build-linux:
    name: Build Linux (Release)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        run: |
          python3 -c 'import pathlib,re; text=pathlib.Path("CMakeLists.txt").read_text(); print("version=" + re.search(r"project\s*\([^)]*?VERSION\s+(\d+\.\d+\.\d+)", text, re.S).group(1))' >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            pkg-config \
            wget \
            xz-utils \
            libuv1-dev \
            zlib1g-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool \
            libzstd-dev \
            nlohmann-json3-dev

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm
          key: llvm-22-linux-x64

      - name: Download and install LLVM 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/LLVM-22.1.4-Linux-X64.tar.xz
          sudo mkdir -p /opt/llvm
          sudo tar -xf LLVM-22.1.4-Linux-X64.tar.xz --strip-components=1 -C /opt/llvm
          rm LLVM-22.1.4-Linux-X64.tar.xz

      - name: Add LLVM to PATH
        run: echo "/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install GoogleTest
        run: |
          # On Ubuntu 24.04 (ubuntu-latest) libgtest-dev ships prebuilt static
          # libraries (libgtest/libgtest_main) that FindGTest picks up directly,
          # so no from-source build is needed (and /usr/src/gtest no longer exists).
          sudo apt-get install -y libgtest-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/opt/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/llvm/bin/clang++ \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DHOO_BUILD_TESTS=ON

      - name: Build all targets
        run: cmake --build build --parallel $(nproc)

      - name: Verify hoo binary
        run: |
          test -f build/hoo || (echo "ERROR: hoo binary not found!" && exit 1)
          build/hoo --version | grep "v${{ steps.version.outputs.version }}"
          echo "Binary verification passed."

      - name: Run all tests
        run: |
          cd build
          ctest --output-on-failure --parallel $(nproc)

      - name: Package artifacts
        run: |
          cmake --install build --prefix package
          test -f package/bin/hoo || (echo "ERROR: hoo binary missing!" && exit 1)
          test -f package/lib/libhoo-core.a || (echo "ERROR: hoo-core library missing!" && exit 1)
          test -f package/lib/libhoo-parser.a || (echo "ERROR: hoo-parser library missing!" && exit 1)
          test -f package/lib/libhoort.a || (echo "ERROR: hoort library missing!" && exit 1)
          test -f package/lib/libhoorepl.a || (echo "ERROR: hoorepl library missing!" && exit 1)
          tar -czf "hoo-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" -C package .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-linux-x86_64
          path: hoo-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          retention-days: 30

  # =====================================================================
  # Windows Build
  # =====================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      LLVM_DIR: C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          if ($text -notmatch 'project\s*\([^)]*?VERSION\s+(\d+\.\d+\.\d+)') {
            throw "Unable to read project version from CMakeLists.txt"
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSVC dev command prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc
          key: llvm-22.1.4-windows

      - name: Download and extract LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz `
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/clang+llvm-22.1.4-x86_64-pc-windows-msvc.tar.xz
          tar -xf llvm.tar.xz -C C:\
          del llvm.tar.xz
          if (-not (Test-Path "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm\LLVMConfig.cmake")) {
            throw "LLVM extraction failed - LLVMConfig.cmake not found"
          }

      - name: Patch LLVMExports.cmake (remove DIA SDK reference)
        shell: pwsh
        run: |
          $file = "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm\LLVMExports.cmake"
          $content = Get-Content $file
          $content -replace 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/DIA SDK/lib/amd64/diaguids.lib;', '' `
                   -replace 'C:/Program Files/Microsoft Visual Studio/2022/Professional/DIA SDK/lib/amd64/diaguids.lib;', '' `
                   -replace 'C:/Program Files/Microsoft Visual Studio/2022/Community/DIA SDK/lib/amd64/diaguids.lib;', '' `
            | Set-Content $file

      - name: Add LLVM bin to PATH
        shell: pwsh
        run: |
          echo "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg installed packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          # Key only on the dependency manifest (+ lockfile when present) so a
          # version bump (which edits CMakeLists.txt) does not invalidate the cache.
          key: vcpkg-windows-msvc-mt-${{ hashFiles('vcpkg.json', 'vcpkg.lockfile') }}

      - name: Configure CMake
        run: cmake --preset windows-vs18-env -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" -DCMAKE_BUILD_TYPE=Release

      - name: Build hoo
        run: cmake --build --preset windows-vs18-env

      - name: Build tests
        run: cmake --build --preset windows-vs18-env-tests

      - name: Run tests
        run: ctest --preset windows-vs18-env --output-on-failure

      - name: Package artifacts
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          # LLVM DLLs needed at runtime. Copy only the components the project
          # links (Core, ExecutionEngine, OrcJIT, Support, Target, TargetParser,
          # native=X86) plus their transitive JIT/format/debug/transform
          # dependencies, and drop the unrelated architecture targets (AArch64,
          # RISCV, PowerPC, WebAssembly, ...) to keep the artifact lean.
          $llvmDlls = Get-ChildItem "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\bin\LLVM*.dll" -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^LLVM(Analysis|AsmParser|AsmPrinter|BinaryFormat|BitReader|BitWriter|CodeGen|Core|DebugInfo|Demangle|Disassembler|ExecutionEngine|FrontendOpenMP|InstCombine|Instrumentation|IPO|IRReader|Linker|MC|MCDisassembler|MCParser|MCTargetDesc|Object|OrcJIT|Passes|ProfileData|Remarks|ScalarOpts|SelectionDAG|Support|TableGen|Target|TargetParser|TransformUtils|X86|WindowsDriver|WindowsManifest)'
          }
          Copy-Item $llvmDlls package\bin\ -ErrorAction SilentlyContinue
          # vcpkg DLLs needed at runtime. Curated to the runtime dependencies
          # (ANTLR runtime, OpenSSL, libcurl, libzip, libuv, zlib, zstd, bzip2),
          # excluding the test-only DLLs (gtest/gmock) from the package.
          $vcpkgDlls = Get-ChildItem "vcpkg_installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -in @('antlr4-runtime.dll','bz2.dll','libcrypto-3-x64.dll','libcurl.dll','libssl-3-x64.dll','uv.dll','zip.dll','zlib1.dll','zstd.dll') -or
            $_.Name -match '^lib(crypto|ssl).*\.dll$' -or $_.Name -match '^zlib.*\.dll$'
          }
          Copy-Item $vcpkgDlls package\bin\ -ErrorAction SilentlyContinue
          foreach ($path in @("package\bin\hoo.exe", "package\lib\hoo-core.lib", "package\lib\hoo-parser.lib", "package\lib\hoort.lib", "package\lib\hoorepl.lib")) {
            if (-not (Test-Path $path)) {
              throw "Required package file missing: $path"
            }
          }
          .\package\bin\hoo.exe --version | Select-String "v${{ steps.version.outputs.version }}"
          Compress-Archive -Path package\* -DestinationPath "hoo-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-windows-x64
          path: hoo-${{ steps.version.outputs.version }}-windows-x64.zip
          retention-days: 30

  # =====================================================================
  # Release Bundle (push to main / release merge only)
  # =====================================================================
  create-release-bundle:
    name: Create Release Bundle
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined archive
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'hoo-*-macos-arm64.tar.gz' -o -name 'hoo-*-linux-x86_64.tar.gz' -o -name 'hoo-*-windows-x64.zip' \) -exec cp {} release/ \;

          cd release
          tar -czf hoo-all-platforms.tar.gz hoo-*

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: hoo-all-platforms
          path: release/hoo-all-platforms.tar.gz
          retention-days: 90

  # =====================================================================
  # Version Bump (gitflow-aware, main only)
  # ---------------------------------------------------------------------
  # Determines the bump level from the branch that was merged into main:
  #   release/*  => minor (+ reset patch), or major on BREAKING change
  #   hotfix/*   => patch, or major on BREAKING change
  # A manual bump_mode via workflow_dispatch overrides the detection.
  # If the source merge cannot be identified as release/* or hotfix/*
  # (e.g. a direct push or an unlabelled squash merge), the bump is
  # SKIPPED rather than guessed — never bump on an ambiguous push.
  # =====================================================================
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump mode from merge
        id: mode
        run: |
          # Prefer an explicit manual override
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.bump_mode }}" != "auto" ]; then
            echo "mode=${{ github.event.inputs.bump_mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inspect the merge commit message to detect the source branch.
          # GitHub merge messages look like:
          #   Merge pull request #N from org/release-v1.2
          #   Merge branch 'release/v1.2'
          MSG="$(git log -1 --pretty=%s)"
          case "$MSG" in
            *"release/"*|*"release-v"*|*"release_"*) echo "mode=release" >> "$GITHUB_OUTPUT" ;;
            *"hotfix/"*|*"hotfix-"*|*"hotfix_"*)     echo "mode=hotfix"  >> "$GITHUB_OUTPUT" ;;
            *)
              # Ambiguous push: skip the bump instead of guessing.
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "  merge message: $MSG" ;;
          esac

      - name: Show detected mode
        run: echo "Detected mode = ${{ steps.mode.outputs.mode }}"

      - name: Bump Version
        if: steps.mode.outputs.mode != 'skip'
        run: python3 scripts/bump_version.py ${{ steps.mode.outputs.mode }}

      - name: Push
        if: steps.mode.outputs.mode != 'skip'
        run: git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip summary
        if: steps.mode.outputs.mode == 'skip'
        run: echo "Skipping version bump - merge source is not a release or hotfix branch"

  # =====================================================================
  # Sync main -> dev (gitflow)
  # ---------------------------------------------------------------------
  # After a version bump lands on main, merge main back into dev so dev
  # carries the released version (CMakeLists.txt, CHANGELOG, badges) and
  # stays in sync as the base for future features and hotfixes.
  # =====================================================================
  sync-main-to-dev:
    name: Sync main to dev
    runs-on: ubuntu-latest
    # Run after the version bump so dev picks up the released version on main.
    needs: [build-macos, build-linux, build-windows, bump-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into dev
        id: sync
        run: |
          git fetch origin main:main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "  dev already contains main; nothing to sync."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit origin/main
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Push dev
        if: steps.sync.outputs.synced == 'true'
        run: git push origin dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # GitHub Release (tag push or manual dispatch)
  # =====================================================================
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: find ./artifacts -type f | sort

      - name: Generate release notes
        run: |
          python3 scripts/generate_changelog.py ${{ steps.tag.outputs.tag }} > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Hoo ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
