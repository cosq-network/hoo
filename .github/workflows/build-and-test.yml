name: Build and Test

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

jobs:
  # =====================================================================
  # macOS Build
  # =====================================================================
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build tools and dependencies
        run: |
          brew install cmake ninja
          brew install llvm antlr4-cpp-runtime googletest

      - name: Configure CMake
        run: |
          cmake --preset macos-homebrew-ninja

      - name: Build all targets
        run: |
          cmake --build build/macos-homebrew-ninja

      - name: Run all tests
        run: |
          ctest --preset macos-homebrew-ninja --verbose --output-on-failure

      - name: Package artifacts
        run: |
          mkdir -p package/bin
          mkdir -p package/lib
          cp build/macos-homebrew-ninja/hoo package/bin/
          cp build/macos-homebrew-ninja/libhoo-core.a package/lib/ || true
          cp build/macos-homebrew-ninja/libhoo-parser.a package/lib/ || true
          cp build/macos-homebrew-ninja/libhoort.a package/lib/ || true
          tar -czf hoo-macos-arm64.tar.gz -C package .

      - name: Verify package contents
        run: |
          ls -la package/bin/
          ls -la package/lib/
          test -f package/bin/hoo || (echo "ERROR: hoo binary missing!" && exit 1)
          echo "Package verification successful"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-macos-arm64
          path: hoo-macos-arm64.tar.gz
          retention-days: 30

  # =====================================================================
  # Linux Build
  # =====================================================================
  build-linux:
    name: Build Linux (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            pkg-config \
            wget \
            xz-utils \
            libuv1-dev

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /opt/llvm
          key: llvm-22-linux-x64

      - name: Download and install LLVM 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/LLVM-22.1.4-Linux-X64.tar.xz
          sudo mkdir -p /opt/llvm
          sudo tar -xf LLVM-22.1.4-Linux-X64.tar.xz --strip-components=1 -C /opt/llvm
          rm LLVM-22.1.4-Linux-X64.tar.xz

      - name: Add LLVM to PATH
        run: echo "/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install ANTLR4 runtime
        run: |
          ANTLR_VERSION=4.13.2
          wget -q https://www.antlr.org/download/antlr4-cpp-runtime-${ANTLR_VERSION}-source.zip
          unzip -q antlr4-cpp-runtime-${ANTLR_VERSION}-source.zip -d antlr4-src
          cmake -S antlr4-src/runtime/Cpp \
                -B antlr4-src/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DWITH_DEMO=OFF \
                -DANTLR_BUILD_CPP_TESTS=OFF
          sudo cmake --build antlr4-src/build --target install
          rm -rf antlr4-src antlr4-cpp-runtime-${ANTLR_VERSION}-source.zip

      - name: Cache GoogleTest
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libgtest*
          key: gtest-linux

      - name: Install GoogleTest
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y libgtest-dev
          cd /usr/src/gtest
          sudo cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make -j$(nproc)
          sudo cp lib/*.a /usr/local/lib/

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/opt/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/llvm/bin/clang++ \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DHOO_BUILD_TESTS=ON

      - name: Build all targets
        run: cmake --build build --parallel $(nproc)

      - name: Verify hoo binary
        run: |
          test -f build/hoo || (echo "ERROR: hoo binary not found!" && exit 1)
          build/hoo --version || true
          echo "Binary verification passed."

      - name: Run all tests
        run: |
          cd build
          ctest --output-on-failure --parallel $(nproc)

      - name: Package artifacts
        run: |
          mkdir -p package/bin package/lib
          cp build/hoo package/bin/
          cp build/libhoo-core.a package/lib/ 2>/dev/null || true
          cp build/libhoo-parser.a package/lib/ 2>/dev/null || true
          cp build/libhoort.a package/lib/ 2>/dev/null || true
          tar -czf hoo-linux-x86_64.tar.gz -C package .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-linux-x86_64
          path: hoo-linux-x86_64.tar.gz
          retention-days: 30

  # =====================================================================
  # Windows Build
  # =====================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    env:
      LLVM_DIR: C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup MSVC dev command prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc
          key: llvm-22.1.4-windows

      - name: Download and extract LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz `
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/clang+llvm-22.1.4-x86_64-pc-windows-msvc.tar.xz
          tar -xf llvm.tar.xz -C C:\
          del llvm.tar.xz
          if (-not (Test-Path "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm\LLVMConfig.cmake")) {
            throw "LLVM extraction failed - LLVMConfig.cmake not found"
          }

      - name: Patch LLVMExports.cmake (remove DIA SDK reference)
        shell: pwsh
        run: |
          $file = "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\lib\cmake\llvm\LLVMExports.cmake"
          $content = Get-Content $file
          $content -replace 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/DIA SDK/lib/amd64/diaguids.lib;', '' `
                   -replace 'C:/Program Files/Microsoft Visual Studio/2022/Professional/DIA SDK/lib/amd64/diaguids.lib;', '' `
                   -replace 'C:/Program Files/Microsoft Visual Studio/2022/Community/DIA SDK/lib/amd64/diaguids.lib;', '' `
            | Set-Content $file

      - name: Add LLVM bin to PATH
        shell: pwsh
        run: |
          echo "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg installed packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-windows-msvc-mt-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/build-and-test.yml') }}

      - name: Configure CMake
        run: cmake --preset windows-vs18-env -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed" -DCMAKE_BUILD_TYPE=Release

      - name: Build hoo
        run: cmake --build --preset windows-vs18-env

      - name: Build tests
        run: cmake --build --preset windows-vs18-env-tests

      - name: Run tests
        run: ctest --preset windows-vs18-env --output-on-failure

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\bin, package\lib | Out-Null
          Copy-Item build\hoo.exe package\bin\
          Copy-Item build\Release\hoo-core.lib package\lib\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\hoo-parser.lib package\lib\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\hoort.lib package\lib\ -ErrorAction SilentlyContinue
          # LLVM DLLs needed at runtime
          Copy-Item "C:\clang+llvm-22.1.4-x86_64-pc-windows-msvc\bin\*.dll" package\bin\ -ErrorAction SilentlyContinue
          # vcpkg DLLs (libcurl, libcrypto, zlib)
          if (Test-Path vcpkg_installed\x64-windows\bin\*.dll) {
            Copy-Item vcpkg_installed\x64-windows\bin\*.dll package\bin\
          }
          Compress-Archive -Path package\* -DestinationPath hoo-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-windows-x64
          path: hoo-windows-x64.zip
          retention-days: 30

  # =====================================================================
  # Release Bundle (push to main only)
  # =====================================================================
  create-release-bundle:
    name: Create Release Bundle
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined archive
        run: |
          mkdir -p release
          cp artifacts/hoo-macos-arm64/hoo-macos-arm64.tar.gz release/
          cp artifacts/hoo-linux-x86_64/hoo-linux-x86_64.tar.gz release/
          cp artifacts/hoo-windows-x64/hoo-windows-x64.zip release/

          cd release
          tar -czf hoo-all-platforms.tar.gz *.tar.gz *.zip

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: hoo-all-platforms
          path: release/hoo-all-platforms.tar.gz
          retention-days: 90

  # =====================================================================
  # GitHub Release (tag push or manual dispatch)
  # =====================================================================
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: find ./artifacts -type f | sort

      - name: Generate release notes
        run: |
          python3 scripts/generate_changelog.py ${{ steps.tag.outputs.tag }} > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Hoo ${{ steps.tag.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
