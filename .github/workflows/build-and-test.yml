name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build tools and dependencies
        run: |
          brew install cmake ninja
          brew install llvm antlr4-cpp-runtime googletest

      - name: Configure CMake
        run: |
          cmake --preset macos-homebrew-ninja

      - name: Build all targets
        run: |
          cmake --build build/macos-homebrew-ninja

      - name: Run all tests
        run: |
          ctest --preset macos-homebrew-ninja --verbose --output-on-failure

      - name: Package artifacts
        run: |
          mkdir -p package/bin
          mkdir -p package/lib
          cp build/macos-homebrew-ninja/hoo package/bin/
          cp build/macos-homebrew-ninja/libhvm.a package/lib/ || true
          cp build/macos-homebrew-ninja/libhoo-compiler.a package/lib/ || true
          cp build/macos-homebrew-ninja/libhoo-parser.a package/lib/ || true
          cp build/macos-homebrew-ninja/libhoort.* package/lib/ || true
          tar -czf hoo-macos-arm64.tar.gz -C package .

      - name: Verify package contents
        run: |
          ls -la package/bin/
          ls -la package/lib/
          test -f package/bin/hoo || (echo "ERROR: hoo binary missing!" && exit 1)
          echo "Package verification successful"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-macos-arm64
          path: hoo-macos-arm64.tar.gz
          retention-days: 30

  build-ubuntu:
    name: Build Ubuntu 24.04
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install build tools and dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake ninja-build make \
            clang llvm-dev \
            libgtest-dev uuid-dev

      - name: Cache ANTLR4 Runtime
        id: cache-antlr4-ubuntu
        uses: actions/cache@v4
        with:
          path: /tmp/antlr4-runtime
          key: ${{ runner.os }}-antlr4-4.13.2

      - name: Build ANTLR4 C++ Runtime
        if: steps.cache-antlr4-ubuntu.outputs.cache-hit != 'true'
        run: |
          ANTLR_VERSION="4.13.2"
          DOWNLOAD_URL="https://www.antlr.org/download/antlr4-cpp-runtime-${ANTLR_VERSION}-source.zip"

          echo "Downloading ANTLR4 C++ runtime ${ANTLR_VERSION}..."
          wget -q ${DOWNLOAD_URL} -O antlr4-cpp-runtime.zip

          echo "Extracting..."
          unzip -q antlr4-cpp-runtime.zip -d antlr4-src

          echo "Building ANTLR4 runtime..."
          mkdir -p antlr4-build
          cd antlr4-build

          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/antlr4-runtime \
            -DANTLR_BUILD_SHARED=OFF \
            -DANTLR_BUILD_CPP_TESTS=OFF \
            ../antlr4-src

          ninja
          ninja install

          cd ..
          rm -rf antlr4-src antlr4-build antlr4-cpp-runtime.zip

      - name: Configure CMake
        run: |
          cmake --preset ubuntu-ninja \
            -DCMAKE_CXX_FLAGS="-DDEBUG_JIT_INIT" \
            -DANTLR4_INCLUDE_DIR=/tmp/antlr4-runtime/include/antlr4-runtime \
            -DANTLR4_LIBRARY=/tmp/antlr4-runtime/lib/libantlr4-runtime.a

      - name: Build all targets
        run: |
          cmake --build build/ubuntu-ninja

      - name: Run all tests
        run: |
          ctest --preset ubuntu-ninja --verbose --output-on-failure

      - name: Package artifacts
        run: |
          mkdir -p package/bin
          mkdir -p package/lib
          cp build/ubuntu-ninja/hoo package/bin/
          cp build/ubuntu-ninja/libhvm.a package/lib/ || true
          cp build/ubuntu-ninja/libhoo-compiler.a package/lib/ || true
          cp build/ubuntu-ninja/libhoo-parser.a package/lib/ || true
          cp build/ubuntu-ninja/libhoort.* package/lib/ || true
          tar -czf hoo-ubuntu-x86_64.tar.gz -C package .

      - name: Verify package contents
        run: |
          ls -la package/bin/
          ls -la package/lib/
          test -f package/bin/hoo || (echo "ERROR: hoo binary missing!" && exit 1)
          echo "Package verification successful"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-ubuntu-x86_64
          path: hoo-ubuntu-x86_64.tar.gz
          retention-days: 30

  build-windows:
    name: Build Windows (Visual Studio)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'D:\vcpkg_fresh'
          vcpkgGitCommitId: 'ae7999818817743d56782df82b3a985e8d91c784'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset windows-vs-relwithdebinfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build all targets
        shell: pwsh
        run: |
          cmake --build build/windows-vs-relwithdebinfo --config RelWithDebInfo

      - name: Run all tests
        shell: pwsh
        run: |
          ctest --preset windows-vs-relwithdebinfo --verbose --output-on-failure

      - name: Package with CPack
        shell: pwsh
        run: |
          cd build/windows-vs-relwithdebinfo
          cpack -C RelWithDebInfo

      - name: Verify CPack package
        shell: pwsh
        run: |
          $pkgPath = "build/windows-vs-relwithdebinfo/hoo-windows-x64.zip"
          if (-not (Test-Path $pkgPath)) {
            Write-Error "ERROR: CPack ZIP package not found at $pkgPath"
            exit 1
          }
          Write-Host "CPack package verification successful"
          Get-ChildItem -Path build/windows-vs-relwithdebinfo -Filter "hoo-windows-x64.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoo-windows-x64
          path: build/windows-vs-relwithdebinfo/hoo-windows-x64.zip
          retention-days: 30

  create-release-bundle:
    name: Create Release Bundle
    runs-on: ubuntu-latest
    needs: [build-macos, build-ubuntu, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined archive
        run: |
          mkdir -p release
          cp artifacts/hoo-macos-arm64/hoo-macos-arm64.tar.gz release/
          cp artifacts/hoo-ubuntu-x86_64/hoo-ubuntu-x86_64.tar.gz release/
          cp artifacts/hoo-windows-x64/hoo-windows-x64.zip release/

          cd release
          tar -czf hoo-all-platforms.tar.gz *.tar.gz *.zip

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: hoo-all-platforms
          path: release/hoo-all-platforms.tar.gz
          retention-days: 90
